aid: inxeption
name: Inxeption
description: >-
  Inxeption was a B2B "industrial commerce" software company founded in 2017 by serial entrepreneur
  Farzad Dibachi and headquartered in Silicon Valley (San Jose / Cupertino, California). It sold a
  cloud commerce platform that let manufacturers, distributors and wholesalers stand up a branded
  online storefront and digital product catalog, then manage quoting, contract-specific pricing,
  purchase orders, bulk and multimodal orders, freight and logistics, returns, payments and sales
  analytics from one place — a category it marketed as the "Industrial Commerce SuperApp". Its
  best-known product was Inxeption Zippy, launched in March 2019 with UPS after an equity investment
  from the UPS Strategic Enterprise Fund, which bundled UPS as the shipper of choice into the
  storefront. The company raised roughly $186M across its rounds, including a $125M Series E in
  January 2022. Inxeption shut down on 2024-08-15. It never operated a public developer program:
  no developer portal, API reference, OpenAPI/AsyncAPI/GraphQL contract, SDK or package was ever
  published, and its integration story was bespoke customer and EDI connections delivered under
  contract. Today only the apex domain resolves, and it no longer belongs to the company — it is
  listed for sale on the serp.domains domain marketplace. This profile is retained as a historical
  company record.
